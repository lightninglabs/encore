# Alternative to templates/retry.yml: call the composite action directly
# instead of the shared reusable workflow. Use this when you would rather pin
# the action per repo than route through a second workflow file.
name: encore

on:
  workflow_run:
    workflows: ["CI", "Integration Tests"]
    types: [completed]

permissions:
  actions: write   # rerun-failed-jobs
  checks: read     # list annotations

concurrency:
  group: encore-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    # Cancelled runs are in scope too: a preemption does not always land as
    # `failure`, and a run encore never sees is a hole it cannot report. Safe
    # because a human-cancelled run carries no infra evidence on any job and so
    # declines itself as no_infra_evidence — at the cost of one runner-minute.
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    # Deliberately NOT the spot pool: the retrier must not be preemptible.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lightninglabs/encore@v1
        with:
          run_id: ${{ github.event.workflow_run.id }}
          max_attempts: 3
